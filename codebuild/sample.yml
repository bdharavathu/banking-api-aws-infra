version: 0.2

env:
  variables:
    NODE_ENV: "dev"
  # parameter-store:
  #   DB_HOST: "/myapp/production/db-host"

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo Installing dependencies...
      - npm ci

  pre_build:
    commands:
      - echo Running lint...
      - npm run lint

  build:
    commands:
      - echo Running tests...
      - npm test
      - echo Building application...
      - npm run build

  post_build:
    commands:
      - echo Build completed successfully.

artifacts:
  files:
    - 'dist/**/*'
    - 'package.json'
  base-directory: '.'
  discard-paths: yes

cache:
  paths:
    - 'node_modules/**/*'   