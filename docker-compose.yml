x-app-env: &app-env
  ENVIRONMENT: local
  DB_HOST: db
  DB_NAME: banking
  DB_USER: banking
  DB_PASSWORD: banking-local-only
  DB_SSLMODE: disable
  API_KEY_HASHES: ed5a18fb8f807f996d649e379d3f35f39c543a91bdbf88c492f2ebd10d4df86c

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: banking
      POSTGRES_USER: banking
      POSTGRES_PASSWORD: banking-local-only
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banking -d banking"]
      interval: 2s
      timeout: 3s
      retries: 20

  migrate:
    build: ./app
    image: banking-api:local
    command: ["alembic", "upgrade", "head"]
    environment: *app-env
    <<: *hardening
    depends_on:
      db: { condition: service_healthy }

  api:
    image: banking-api:local
    environment:
      <<: *app-env
      ENABLE_DOCS: "true"
    ports: ["127.0.0.1:8000:8000"]
    <<: *hardening
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
