name: terraform

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yaml"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yaml"

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_DIR: infra/envs/dev
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_github_repo: ${{ github.repository }}
  TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}

jobs:
  plan-pr:
    name: Plan (pull request)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~1.14"
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_TF_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: terraform plan
        run: |
          terraform -chdir="$TF_DIR" init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="kms_key_id=${{ vars.TF_STATE_KMS_KEY_ARN }}"
          terraform -chdir="$TF_DIR" plan -lock=false -refresh=false -no-color > plan.txt 2>&1 || { cat plan.txt; exit 1; }
          cat plan.txt
      - name: Redact plan
        env:
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
        run: |
          account=$(aws sts get-caller-identity --query Account --output text)
          sed -e "s|$account|<account-id>|g" plan.txt > plan-redacted.txt
          if [ -n "$ALERT_EMAIL" ]; then
            sed -i -e "s|$ALERT_EMAIL|<alert-email>|g" plan-redacted.txt
          fi
      - name: Comment plan on PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Terraform plan"
            echo '```'
            tail -c 60000 plan-redacted.txt
            echo '```'
          } > comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file comment.md

  validation:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/validation.yaml
    with:
      app: false
      infra: true
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write

  plan:
    name: Plan
    needs: validation
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~1.14"
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_TF_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: terraform plan
        run: |
          terraform -chdir="$TF_DIR" init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="kms_key_id=${{ vars.TF_STATE_KMS_KEY_ARN }}"
          terraform -chdir="$TF_DIR" plan -lock=false -refresh=false -no-color | tee plan.txt
          {
            echo "### Terraform plan"
            echo '```'
            tail -c 60000 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    name: Apply
    needs: plan
    runs-on: ubuntu-24.04
    environment: infra
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~1.14"
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_TF_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: terraform apply
        run: |
          terraform -chdir="$TF_DIR" init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="kms_key_id=${{ vars.TF_STATE_KMS_KEY_ARN }}"
          terraform -chdir="$TF_DIR" plan -no-color -out=tfplan
          terraform -chdir="$TF_DIR" apply -no-color tfplan
