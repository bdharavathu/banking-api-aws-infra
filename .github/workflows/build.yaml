name: build

on:
  workflow_call:
    outputs:
      image:
        description: Image reference with digest
        value: ${{ jobs.build.outputs.image }}
      tag:
        description: Image tag (short commit SHA)
        value: ${{ jobs.build.outputs.tag }}

permissions:
  contents: read

env:
  ECR_REPOSITORY: banking-api-dev

jobs:
  build:
    name: Build, scan, push
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.digest.outputs.image }}
      tag: ${{ steps.existing.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_APP_BUILD_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        id: ecr

      - name: Check for existing image
        id: existing
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          tag=${GITHUB_SHA::7}
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "IMAGE=$REGISTRY/$ECR_REPOSITORY:$tag" >> "$GITHUB_ENV"
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
              --image-ids imageTag="$tag" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.existing.outputs.found != 'true'

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: steps.existing.outputs.found != 'true'
        with:
          context: app
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: steps.existing.outputs.found != 'true'
        with:
          image-ref: ${{ env.IMAGE }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        if: steps.existing.outputs.found != 'true'
        with:
          image: ${{ env.IMAGE }}
          format: spdx-json
          artifact-name: sbom.spdx.json

      - name: Push image
        if: steps.existing.outputs.found != 'true'
        run: docker push "$IMAGE"

      - name: Resolve digest
        id: digest
        run: |
          digest=$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$TAG" --query 'imageDetails[0].imageDigest' --output text)
          echo "image=${IMAGE%:*}@$digest" >> "$GITHUB_OUTPUT"
